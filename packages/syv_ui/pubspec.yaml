name: syv_ui
description: >-
  Subordinación y Valor — "Diseño Verde" design system as a reusable Flutter
  package. Tokens (DTCG-generated), theme, foundations and the Syv* components.
  Framework-agnostic in spirit; extractable as a standalone package.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
